name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis: ['6.2', '7.4', '8.0']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDISUI_TEST_REDIS: localhost:6379
      REDISUI_BROWSER_FIXTURE: ${{ github.workspace }}/browser-fixture.html
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test RedisUI.Tests/RedisUI.Tests.csproj -c Release --no-build --logger trx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tests/browser install --frozen-lockfile
      - run: pnpm --dir tests/browser exec playwright install --with-deps chromium
      - run: node tests/browser/smoke.cjs
